<!-- Fonts are self-hosted (assets/fonts, declared in assets/css/fonts.css).
     The two latin files carry every weight used above the fold. -->

<link rel="preload" href="assets/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>

<!-- One stylesheet, built by build.mjs from the files in assets/css/. -->
<link rel="stylesheet" href="{{css_href}}">

<!-- Analytics. Vercel Web Analytics: no cookies, so no consent banner. It
     records nothing until it is enabled in the Vercel dashboard (project,
     Analytics, Enable); until then the script below answers 404 and the
     page is unaffected. -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
