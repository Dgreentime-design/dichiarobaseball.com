<form class="team-code__form" data-team-code novalidate>
  <div class="field">
    <label for="team-code-input">Team or town code</label>
    <div class="team-code__row">
      <input class="input input--code" id="team-code-input" name="code" type="text" placeholder="e.g. ABCD-2345" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="40" required>
      <button class="btn btn--primary" type="submit" data-team-code-submit>Find my camp</button>
    </div>
    <p class="field__error team-code__message" data-team-code-message aria-live="polite"></p>
  </div>
</form>
